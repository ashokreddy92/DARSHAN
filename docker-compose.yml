version: '3.8'

services:
  # ==========================================================
  # Redis 7 (Cache, Coordination, Rate Limiting, OTP, Locks)
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: darshanease-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: >
      redis-server
      --save 60 1
      --loglevel notice
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - darshanease-network

  # ==========================================================
  # MongoDB (Primary Persistent Database)
  # ==========================================================
  mongodb:
    image: mongo:7-jammy
    container_name: darshanease-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: darshanease
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - darshanease-network

  # ==========================================================
  # RabbitMQ 3.13 (Message Broker with Management UI & Healthcheck)
  # ==========================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: darshanease-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'     # AMQP protocol
      - '15672:15672'   # Management Web Dashboard
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - darshanease-network

  # ==========================================================
  # Backend API Server (Node.js + Express)
  # ==========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darshanease-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/darshanease
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=true
      - REDIS_KEY_PREFIX=darshanease:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - RABBITMQ_ENABLED=true
      - RABBITMQ_VHOST=/
      - JWT_SECRET=production_darshanease_super_secure_jwt_secret_2026!
      - JWT_EXPIRES_IN=7d
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - darshanease-network

  # ==========================================================
  # Frontend Web Client (React + Vite)
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: darshanease-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - darshanease-network

networks:
  darshanease-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local
  rabbitmq_data:
    driver: local
